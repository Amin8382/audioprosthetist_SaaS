spring.datasource.url=${MARKETPLACE_TEST_DB_URL:jdbc:postgresql://localhost:5432/odyio_marketplace_test}
spring.datasource.username=${MARKETPLACE_TEST_DB_USERNAME:postgres}
spring.datasource.password=${MARKETPLACE_TEST_DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

marketplace.storage.product-images-root=${MARKETPLACE_TEST_PRODUCT_IMAGES_ROOT:${java.io.tmpdir}/odyio-marketplace-test/product-images}
marketplace.storage.product-images-public-path=/api/marketplace/files/products
marketplace.storage.max-image-size-bytes=5242880

eureka.client.enabled=false
