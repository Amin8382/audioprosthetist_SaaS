spring.application.name=odyio-marketplace-service
server.port=8081

spring.datasource.url=jdbc:postgresql://localhost:5432/odyio_marketplace
spring.datasource.username=postgres
spring.datasource.password=postgres

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.servlet.multipart.max-file-size=6MB
spring.servlet.multipart.max-request-size=6MB

marketplace.storage.product-images-root=${MARKETPLACE_PRODUCT_IMAGES_ROOT:./storage/product-images}
marketplace.storage.product-images-public-path=/api/marketplace/files/products
marketplace.storage.max-image-size-bytes=5242880

eureka.client.enabled=false
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

management.endpoints.web.exposure.include=health
